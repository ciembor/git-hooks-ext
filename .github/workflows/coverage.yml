name: Coverage

on:
  push:
    paths-ignore:
      - coverage-badge.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang
      LLVM_COV: llvm-cov
      LLVM_PROFDATA: llvm-profdata
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Verify 100% coverage
        run: make coverage
      - name: Update coverage percentage badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -s coverage/report.txt
          percentage=$(cat coverage/source-line-coverage.txt)
          case "$percentage" in
            100.00%) color=brightgreen ;;
            90.*|9[5-9].*) color=yellowgreen ;;
            80.*|9[0-4].*) color=yellow ;;
            *) color=red ;;
          esac
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s","cacheSeconds":60}\n' \
            "$percentage" "$color" > coverage-badge.json
          if git diff --quiet -- coverage-badge.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage-badge.json
          git commit -m "chore: update coverage badge [skip ci]"
          git push
