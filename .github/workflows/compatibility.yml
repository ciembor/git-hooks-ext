name: Git compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/integration/**"
      - "tests/run.sh"
      - "tests/compat/**"
      - "Makefile"
      - ".github/workflows/compatibility.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/integration/**"
      - "tests/run.sh"
      - "tests/compat/**"
      - "Makefile"
      - ".github/workflows/compatibility.yml"

permissions:
  contents: read

jobs:
  reference-transaction:
    name: Git ${{ matrix.version }} / ${{ matrix.ref_format }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.27.0
            ref_format: files
            expected: no,no,no,no,no,no
          - version: 2.28.0
            ref_format: files
            expected: yes,yes,no,yes,yes,yes
          - version: 2.29.0
            ref_format: files
            expected: yes,yes,no,yes,yes,yes
          - version: 2.30.0
            ref_format: files
            expected: yes,yes,no,yes,yes,yes
          - version: 2.31.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.32.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.33.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.34.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.35.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.36.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.37.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.38.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.39.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.39.3
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.40.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.41.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.42.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.43.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.44.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.45.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.46.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.47.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.48.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.49.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.50.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.51.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.52.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.53.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.54.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.55.0
            ref_format: files
            expected: yes,no,no,yes,no,yes
          - version: 2.55.0
            ref_format: reftable
            expected: yes,no,no,yes,no,yes
    steps:
      - uses: actions/checkout@v5
      - name: Build Git and probe reference transactions
        env:
          GHE_COMPAT_CACHE: ${{ runner.temp }}/git-hooks-ext-git-compat
          VERSION: ${{ matrix.version }}
          REF_FORMAT: ${{ matrix.ref_format }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          tests/compat/build-git.sh "$VERSION" "$REF_FORMAT" | tee result.tsv
          actual=$(awk 'NR > 1 { print $5 }' result.tsv | paste -sd, -)
          test "$actual" = "$EXPECTED"
      - name: Build helper and run real Git end-to-end events
        env:
          GHE_COMPAT_CACHE: ${{ runner.temp }}/git-hooks-ext-git-compat
          VERSION: ${{ matrix.version }}
          REF_FORMAT: ${{ matrix.ref_format }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          make
          tests/compat/e2e.sh "$GHE_COMPAT_CACHE/git-$VERSION/git" "$PWD/git-hooks-ext" "$REF_FORMAT" "$EXPECTED" | tee e2e.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: git-${{ matrix.version }}-${{ matrix.ref_format }}
          path: |
            result.tsv
            e2e.tsv
